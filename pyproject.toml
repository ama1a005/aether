[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "aether"
version = "0.1.0"
description = "AETHER: Cross-Agent Causal Circuit Discovery for Adversarial Trust Failures"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "pandas>=2.0",
    "psutil>=5.9",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "tqdm>=4.65",
    "rich>=13.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.40",
    "accelerate>=0.28",
    "huggingface-hub>=0.21",
    "safetensors>=0.4",
    "einops>=0.7",
    "bitsandbytes>=0.43; platform_system=='Linux'",
]
dev = [
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.5",
    "ruff>=0.1",
]
demo = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "mcp[cli]==1.27.1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
