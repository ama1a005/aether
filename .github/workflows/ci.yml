name: Python 3.11 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --requirement requirements-demo-lock.txt
          python -m pip install --no-deps --editable .
          python -m pip check
      - name: Run complete test suite
        run: python -m pytest tests/unit tests/integration tests/regression -ra
      - name: Model-free demo end-to-end
        env:
          AETHER_RUN_DEMO_E2E: "1"
        run: python -m pytest tests/integration/test_review_demo_e2e.py -ra
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - name: Frontend tests and production build
        working-directory: demo/frontend
        run: |
          npm ci
          npm test
          npm run build
