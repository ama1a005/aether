experiment_id: "P0_target_20261008_review_target_0"
description: "Review target harness — Member 1 (P1). Two-agent pipeline: AgentA (MCP tool calls) -> A2A message -> AgentB (decision). Runs clean + attacked pairs."
mode: "clean_and_attacked"
model:
  agent_a: "rule_based_v1"
  agent_b: "rule_based_v1"
case_source:
  type: synthetic          # generates diverse ECG cases (ESCALATE + DO_NOT_ESCALATE mix)
  seed: 42
attack:
  clean_spec: tests/fixtures/clean_attack_spec.json
  poison_spec: tests/fixtures/poison_attack_spec.json
  families:
    - tool_description_poison
    - tool_output_inject
seed: 42
n_cases: 8               # 8 cases -> diverse ground-truth mix
output:
  trace_dir: results/raw/
  log_dir: results/raw/logs/
decoding:
  temperature: 0.0         # deterministic (rule-based, not a real LLM)
  max_new_tokens: 64
