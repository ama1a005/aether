schema_version: aether.qci2-method-freeze-amendment.v2.2
status: AWAITING_HUMAN_REVIEW
supersedes_amendment: configs/phase1_core/qci2_method_freeze_v2_1_amendment.yaml
base_proposal_path: configs/phase1_core/qci2_method_freeze_v2.yaml
base_proposal_sha256: b15b660f3a5f7843e84d3612a8ec0a9434735da34d614c3645d3d5a2cc947d2c
reason: >-
  The approved method requires an attacked rescue measurement and a distinct
  clean-to-clean identity execution for benign damage for every evaluated mask.
  V2.1 counted only one five-forward condition per case and therefore could not
  produce both frozen metrics. This correction counts both conditions without
  changing candidates, masks, methods, cases, thresholds or split protections.
forward_accounting_correction:
  sender_autoregressive_steps_per_case_condition: 4
  receiver_forward_steps_per_case_condition: 1
  conditions_per_mask_evaluation: 2
  case_count: 16
  model_forwards_per_mask_evaluation: 160
  baseline_forward_steps: 160
  maximum_model_forward_steps: 7360
derivation:
  per_mask: 16 * 2 * (4 + 1) = 160
  baselines: 16 * 2 * (4 + 1) = 160
  search_masks: 32 * 160 = 5120
  negative_controls: 6 * 160 = 960
  checkpoint_reload: 1 * 160 = 160
  independent_verification: 1 * 160 = 160
  local_minimality: 5 * 160 = 800
  total: 160 + 5120 + 960 + 160 + 160 + 800 = 7360
scientific_method_changes: none_accounting_only
unchanged:
  - qci1_and_qci2_evidence
  - candidate_graph
  - mask_semantics
  - overlap_constraints
  - methods_and_seeds
  - maximum_unique_search_masks_32
  - maximum_total_mask_evaluations_45
  - objective_and_thresholds
  - benign_metric_and_threshold
  - bvp_edge_acceptance
  - split_guards
  - construct_validity_protocol
review:
