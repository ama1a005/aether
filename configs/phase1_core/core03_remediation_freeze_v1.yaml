  core02_proposal:
    path: configs/phase1_core/qci2_method_freeze_v2.yaml
    sha256: b15b660f3a5f7843e84d3612a8ec0a9434735da34d614c3645d3d5a2cc947d2c
  core02_accounting:
    path: configs/phase1_core/qci2_method_freeze_v2_2_amendment.yaml
    sha256: fed75de69761c504653026a8a919014ea40bca8f8efe1c2b2f1127206cfda03b
  core02_summary:
    path: results/phase1/search_comparison/summary.json
    sha256: 9eb40c3e6b81058e7151976f7f69f94bed6344f7c2e132480cc45c6d101e3471
  core02_results:
