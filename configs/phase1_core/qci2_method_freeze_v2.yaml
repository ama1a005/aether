  qci2_discovery_assessments: {path: results/phase1/causal_interventions/qwen15b_qci2_discovery/candidate_assessments.json, sha256: 925269aa543a7f4d1d5b85935e4eb02cfed5d5997b23f51b28174d2aa4edc201}
  qci2_audit_protocol: {path: configs/causal_candidates/qwen_1_5b_qci2_development_audit_v1.json, sha256: b957bb9905de490d994ede01a4b381348f3c18ae385a4dfe2dfd182172404a29}
  qci2_audit_summary: {path: results/phase1/causal_interventions/qwen15b_qci2_audit/summary.json, sha256: e1284b7bb8a066ae054e5ef1ff254a4865fad302b6e40f10ba88a0469316ed78}
  qci2_audit_assessments: {path: results/phase1/causal_interventions/qwen15b_qci2_audit/candidate_audit_assessments.json, sha256: 62e4939940c6bfe2b497ff576f685d97ef3e4ac7cb7e1826d8fb78f10b578b17}
