services:
  hapi-fhir:
    image: hapiproject/hapi@sha256:e60b0a2063db0c8ee65fc34206aed9df232a39d5e29ee37fdd9df74551895cd6
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "false"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/fhir/metadata >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  wso2-fhir-mcp:
    image: wso2/fhir-mcp-server@sha256:2028481e78580416cf31ee50e769fe981e9ecbf1f91419ea6e0aeed88cf03e79
    environment:
      FHIR_SERVER_BASE_URL: http://hapi-fhir:8080/fhir
      FHIR_SERVER_DISABLE_AUTHORIZATION: "True"
      FHIR_MCP_HOST: 0.0.0.0
      FHIR_MCP_PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      hapi-fhir:
        condition: service_healthy

